<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vChat drawer demo</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif}
    .page{padding:48px;max-width:620px}
    .open-btn{padding:10px 18px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer;font:600 14px system-ui}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
    .overlay.show{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;height:100vh;width:420px;
      box-shadow:-8px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s;
      display:flex;flex-direction:column;z-index:10}
    .drawer.show{transform:translateX(0)}
    .drawer .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
    .drawer .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
    .x{background:0;border:0;font-size:20px;cursor:pointer;line-height:1}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.jsx"></script>
</body>
</html>
